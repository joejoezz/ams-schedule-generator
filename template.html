<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: each day reads as a sky, one forecast block per time slot; the day tabs stay pinned at the top. */
:root{
  --navy:#00386b;--blue:#0072bc;--sky:#d9eefa;--sky2:#f2f9fd;--card:#ffffff;--ink:#10304d;--muted:#4b6680;--line:#c4dcec;
  --sun:#f7b500;--cloud:#ffffff;--cloudshade:#b9d3e6;--storm:#54708a;--rain:#0072bc;--pick:#00386b;--pickink:#ffffff;
  --navybar:#00386b;--herotop:#00386b;--herobot:#0072bc;--heroink:#ffffff;--chip:#d9eefa;--chipink:#00386b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#9fd4f5;--blue:#5fb8ec;--sky:#0f2b45;--sky2:#0a1f33;--card:#123250;--ink:#e6f2fa;--muted:#a5c0d5;--line:#28506f;
  --cloud:#dcebf5;--cloudshade:#8fabc0;--storm:#7f9bb3;--rain:#5fb8ec;--pick:#5fb8ec;--pickink:#04233c;
  --navybar:#04233c;--herotop:#04233c;--herobot:#0a4470;--chip:#0f2b45;--chipink:#9fd4f5;color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#9fd4f5;--blue:#5fb8ec;--sky:#0f2b45;--sky2:#0a1f33;--card:#123250;--ink:#e6f2fa;--muted:#a5c0d5;--line:#28506f;
  --cloud:#dcebf5;--cloudshade:#8fabc0;--storm:#7f9bb3;--rain:#5fb8ec;--pick:#5fb8ec;--pickink:#04233c;
  --navybar:#04233c;--herotop:#04233c;--herobot:#0a4470;--chip:#0f2b45;--chipink:#9fd4f5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--sky2);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--blue)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.daybar{position:sticky;top:0;z-index:10;background:var(--navybar);box-shadow:0 2px 10px rgba(0,30,60,.3)}
.daynav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-block:8px}
.daytab{display:grid;justify-items:center;padding:4px 2px 6px;border-radius:14px;color:#fff;text-decoration:none;line-height:1.1;min-height:44px}
.daytab svg{width:30px;height:30px}
.daytab b{font-family:var(--display);font-size:1.1rem}
.daytab small{font-size:.74rem;font-weight:600;opacity:.9}
.daytab:hover{background:rgba(255,255,255,.14)}
.daytab[aria-current]{background:#fff;color:#00386b;--cloud:#fff;--cloudshade:#8fb4cf;--storm:#54708a;--rain:#0072bc}
.daytab:focus-visible,.tile:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:linear-gradient(180deg,var(--herotop),var(--herobot));color:var(--heroink);position:relative;overflow:hidden}
.hero .wrap{padding-block:36px 72px;position:relative;z-index:1}
.eyebrow{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;opacity:.9}
h1{font-size:clamp(2.5rem,8vw,4.4rem);font-weight:800;margin-top:4px}
.hero p{margin:8px 0 0;max-width:34em;font-size:1.05rem}
.herocloud{position:absolute;bottom:-10px;left:0;width:100%;height:64px;display:block}
.herosun{position:absolute;right:max(16px,6vw);top:22px;width:clamp(72px,14vw,120px);height:auto}
.outlook{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:-28px;position:relative;z-index:2}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 10px 12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.tile:hover{border-color:var(--blue)}
.tile svg{width:52px;height:52px}
.tile b{font-family:var(--display);font-size:1.05rem;color:var(--navy)}
.tile span{font-size:.82rem;line-height:1.25;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-weight:600;font-size:.76rem}
main{padding-block:28px 40px;display:grid;gap:30px}
.block{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;scroll-margin-top:92px}
.when{text-align:center}
.when svg{width:72px;height:72px}
.when b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--navy);line-height:1.1}
.when small{color:var(--muted);font-weight:600}
.stack{display:grid;gap:12px;min-width:0}
.pick{background:var(--card);border:2px solid var(--pick);border-radius:20px;overflow:hidden}
.pickhead{background:var(--pick);color:var(--pickink);padding:12px 16px}
.pickhead .tag{font-weight:800;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.pickhead h3{font-size:1.35rem;font-weight:700}
.pickhead a{color:inherit}
.pickhead small{font-weight:600}
.why{padding:12px 16px 0;font-weight:600;color:var(--navy);margin:0}
.talks{list-style:none;margin:0;padding:8px 16px 14px;display:grid}
.talks li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.talks li:first-child{border-top:0}
.talks time{font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;font-size:.9rem}
.talks strong{display:block;line-height:1.3}
.talks p{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.star{display:inline-block;background:var(--sun);color:#10304d;border-radius:99px;padding:0 8px;font-size:.72rem;font-weight:800;margin-left:4px;white-space:nowrap}
.altlabel{font-family:var(--display);font-weight:700;color:var(--muted);margin:4px 0 -4px}
details{background:var(--sky);border-radius:14px;padding:10px 14px;min-width:0}
summary{cursor:pointer;font-weight:800;color:var(--navy);line-height:1.3}
summary small{display:block;font-weight:600;color:var(--muted)}
details .why{padding:8px 0 0;font-weight:400;color:var(--ink)}
details .talks{padding:6px 0 0}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.poster{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.poster h4{margin:0;font-size:.97rem;line-height:1.3}
.poster small{color:var(--blue);font-weight:800}
.poster p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.ph{font-family:var(--display);font-size:1.1rem;color:var(--navy);margin:6px 0 -2px;font-weight:700}
.more{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:4px;font-size:.86rem;font-weight:700}
details.abs{background:none;border-radius:0;padding:0;flex:0 1 auto}
details.abs[open]{flex-basis:100%}
details.abs summary{color:var(--blue);font-weight:700}
.talks details.abs p,.poster details.abs p{margin:6px 0 4px;color:var(--ink);font-weight:400;font-size:.9rem}
footer{border-top:2px solid var(--line);padding-block:16px 32px;color:var(--muted);font-size:.86rem}
.drop{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.flash{animation:flash 3.5s steps(1) infinite}
@keyframes flash{0%,88%,100%{opacity:1}92%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.drop,.flash{animation:none}}
@media (max-width:640px){
  .outlook{grid-template-columns:repeat(2,minmax(0,1fr))}
  .block{grid-template-columns:minmax(0,1fr);gap:8px}
  .herosun{display:none}
  .when{display:flex;align-items:center;gap:10px;text-align:left}
  .when svg{width:52px;height:52px}
}
</style>
<div class="daybar"><nav class="wrap daynav" id="daynav" aria-label="Conference day"></nav></div>

<header class="hero">
  <svg class="herosun" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#f7b500" stroke-width="6" stroke-linecap="round"><path d="M50 6v12M50 82v12M6 50h12M82 50h12M19 19l8 8M73 73l8 8M19 81l8-8M73 27l8-8"/></g><circle cx="50" cy="50" r="22" fill="#f7b500"/><circle cx="42" cy="47" r="2.6" fill="#00386b"/><circle cx="58" cy="47" r="2.6" fill="#00386b"/><path d="M42 56q8 7 16 0" fill="none" stroke="#00386b" stroke-width="3" stroke-linecap="round"/></svg>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p><strong id="dayname"></strong><br><span id="dayoutlook"></span></p>
  </div>
  <svg class="herocloud" viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true"><path fill="var(--sky2)" d="M0 64V38q40-26 90-8 30-30 90-14 40-22 90 2 50-24 110 0 40-20 90 0 50-26 110-2 40-18 90 4 50-22 110 0 50-18 110 8 60-12 110 12v24z"/></svg>
</header>

<div class="wrap">
  <nav class="outlook" id="outlook" aria-label="Day at a glance"></nav>
  <main id="day"></main>
  <footer id="foot"></footer>
</div>
<script>
const ICON={
 sun:'<circle cx="32" cy="32" r="13" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="4" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M14 14l5 5M45 45l5 5M14 50l5-5M45 19l5-5"/></g><circle cx="27" cy="30" r="1.8" fill="#10304d"/><circle cx="37" cy="30" r="1.8" fill="#10304d"/><path d="M27 36q5 4 10 0" fill="none" stroke="#10304d" stroke-width="2" stroke-linecap="round"/>',
 cu:'<circle cx="44" cy="20" r="10" fill="var(--sun)"/><path fill="var(--cloud)" stroke="var(--cloudshade)" stroke-width="2.5" d="M16 50a10 10 0 0 1-1-20 13 13 0 0 1 25-3 10 10 0 0 1 11 9 7 7 0 0 1-1 14z"/>',
 rain:'<path fill="var(--cloud)" stroke="var(--cloudshade)" stroke-width="2.5" d="M16 40a10 10 0 0 1-1-20 13 13 0 0 1 25-3 10 10 0 0 1 11 9 7 7 0 0 1-1 14z"/><g stroke="var(--rain)" stroke-width="3.5" stroke-linecap="round"><path class="drop" d="M22 46l-2 6"/><path class="drop" style="animation-delay:.5s" d="M33 46l-2 6"/><path class="drop" style="animation-delay:1s" d="M44 46l-2 6"/></g>',
 tcu:'<path fill="var(--cloud)" stroke="var(--cloudshade)" stroke-width="2.5" d="M14 54a9 9 0 0 1 0-18 10 10 0 0 1 6-11 12 12 0 0 1 23-3 10 10 0 0 1 4 15 9 9 0 0 1 2 17z"/>',
 storm:'<path fill="var(--storm)" d="M8 14q24-10 48 0-8 4-13 4a10 10 0 0 1 2 18 8 8 0 0 1-3 14H17a9 9 0 0 1-1-18 12 12 0 0 1 7-14Q15 18 8 14z"/><path class="flash" fill="var(--sun)" d="M34 30l-9 14h7l-4 12 12-16h-7l5-10z"/>',
 poster:'<path fill="var(--cloud)" stroke="var(--cloudshade)" stroke-width="2.5" d="M18 44a9 9 0 0 1-1-18 12 12 0 0 1 23-3 9 9 0 0 1 10 8 7 7 0 0 1-1 13z"/><g fill="var(--blue)"><circle class="drop" cx="24" cy="52" r="3"/><circle class="drop" style="animation-delay:.6s" cx="36" cy="54" r="4"/><circle class="drop" style="animation-delay:1.1s" cx="46" cy="51" r="2.5"/></g>',
 moon:'<path fill="var(--sun)" d="M42 10a22 22 0 1 0 12 32A18 18 0 0 1 42 10z"/><g fill="var(--blue)"><circle cx="50" cy="16" r="2"/><circle cx="57" cy="28" r="1.5"/><circle cx="12" cy="12" r="1.5"/></g>'};
const svg=k=>`<svg viewBox="0 0 64 64" aria-hidden="true">${ICON[k]}</svg>`;
const DATA={{DATA}};
const DAYS=DATA.days;
const S=id=>DATA.session_url.replace("{id}",id);
const e=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const PAPER=id=>DATA.session_url.replace("Session/{id}",`Paper/${id}`);
const more=x=>{const link=x.paper?`<a href="${PAPER(x.paper)}" target="_blank" rel="noopener">AMS page</a>`:"";const abs=x.abstract?`<details class="abs"><summary>Full abstract</summary><p>${e(x.abstract)}</p></details>`:"";return link||abs?`<div class="more">${link}${abs}</div>`:""};
const talks=t=>t&&t.length?`<ul class="talks">${t.map(x=>`<li><time>${x.time}</time><div><strong>${e(x.title)}${x.badge?`<span class="star">${e(x.badge)}</span>`:""}</strong><p>${e(x.by)}. ${e(x.blurb)}</p>${more(x)}</div></li>`).join("")}</ul>`:"";
const alt=a=>{const n=(a.talks||[]).length;return `<details><summary>${e(a.title)}<small>Room ${e(a.room)}${n?` · ${n} talk${n===1?"":"s"}`:""}</small></summary><p class="why">${e(a.why)} <a href="${S(a.id)}" target="_blank" rel="noopener">View session on the AMS site</a></p>${talks(a.talks)}</details>`};
const pgroups=g=>g.map(x=>`<div class="ph">${e(x.name)}</div><div class="posters">${x.items.map(p=>`<div class="poster"><h4>${e(p.title)}</h4><small>${e(p.by)}</small><p>${e(p.blurb)}</p>${more(p)}</div>`).join("")}</div>`).join("");
const section=b=>{
 const when=`<div class="when">${svg(b.icon)}<div><b>${b.time}</b><small>to ${b.end}<br>${e(b.label)}</small></div></div>`;
 const wrap=x=>`<section class="block" id="${b.id}">${when}<div class="stack">${x}</div></section>`;
 if(b.posters) return wrap(`<div class="pick"><div class="pickhead"><div class="tag">Poster session</div><h3>${e(b.posters.title||"Posters and coffee")}</h3><small>${e(b.posters.room)}</small></div><p class="why" style="padding-bottom:12px">${e(b.posters.note)}</p></div>${pgroups(b.posters.groups)}`);
 if(b.evening) return wrap(`<div class="pick"><div class="pickhead"><div class="tag">After hours</div><h3>${e(b.evening)}</h3></div><ul class="talks">${b.list.map(l=>`<li><time>${l.time}</time><div><strong>${l.id?`<a href="${S(l.id)}" target="_blank" rel="noopener">${e(l.title)}</a>`:e(l.title)}</strong><p>${e(l.note)}</p></div></li>`).join("")}</ul></div>`);
 const p=b.pick,alts=b.alts||[];
 return wrap(`<div class="pick"><div class="pickhead"><div class="tag">Top pick</div><h3><a href="${S(p.id)}" target="_blank" rel="noopener">${e(p.title)}</a></h3><small>Room ${e(p.room)} · <a href="${S(p.id)}" target="_blank" rel="noopener">View session on the AMS site</a></small></div><p class="why">${e(p.why)}</p>${talks(p.talks)||'<div style="height:12px"></div>'}</div>${alts.length?`<div class="altlabel">Other options</div>${alts.map(alt).join("")}`:""}`);
};
const show=(k,target)=>{
 const d=DAYS.find(x=>x.key===k)||DAYS[0];
 document.getElementById("daynav").style.gridTemplateColumns=`repeat(${DAYS.length},minmax(0,1fr))`;
 document.getElementById("daynav").innerHTML=DAYS.map(x=>`<a class="daytab" href="#${x.key}"${x===d?' aria-current="page"':""}>${svg(x.icon)}<b>${x.tab}</b><small>${x.date}</small></a>`).join("");
 document.getElementById("dayname").textContent=d.full;
 document.getElementById("dayoutlook").textContent=d.outlook;
 document.getElementById("outlook").innerHTML=d.blocks.filter(b=>!b.evening).map(b=>`<a class="tile" href="#${d.key}/${b.id}">${svg(b.icon)}<b>${b.time}</b><span>${e(b.short)}</span><small>${e(b.posters?b.posters.room:b.pick.room)}</small></a>`).join("");
 document.getElementById("day").innerHTML=d.blocks.map(section).join("");
 const el=target&&document.getElementById(target);
 if(el) el.scrollIntoView(); else window.scrollTo(0,0);
};
const route=()=>{
 const m=location.hash.slice(1).split("/");
 if(DAYS.some(x=>x.key===m[0])) return show(m[0],m[1]);
 const n=new Date(),iso=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
 show((DAYS.find(x=>x.iso===iso)||DAYS[0]).key);
};
document.getElementById("eyebrow").textContent=DATA.eyebrow;
document.getElementById("title").textContent=DATA.title;
document.getElementById("foot").textContent=DATA.footer;
addEventListener("hashchange",route);
route();
</script>
</html>
